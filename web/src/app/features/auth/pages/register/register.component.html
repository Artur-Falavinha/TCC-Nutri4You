<app-auth-page-layout>
  <app-auth-form-card title="Dados do cadastro">
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <p>E-mail confirmado: <strong>{{ emailConfirmado }}</strong></p>

      <app-ui-input
        label="Nome completo"
        placeholder="Seu nome"
        autocomplete="name"
        [required]="true"
        formControlName="nome"
        [errorMessage]="fieldError('nome')"
      />

      <app-ui-input
        label="CRN"
        placeholder="CRN-0 00000"
        mask="crn"
        autocomplete="off"
        [required]="true"
        formControlName="crn"
        [errorMessage]="fieldError('crn')"
      />

      <a [href]="urlTermos" target="_blank" rel="noopener">Ler termos de uso e aviso de privacidade (PDF)</a>
      <app-ui-checkbox
        checkboxId="terms"
        label="Li e aceito os termos de uso e declaro que meus dados profissionais são verdadeiros e que meu CRN é válido."
        [required]="true"
        formControlName="termsAccepted"
        [errorMessage]="termsError()"
      />

      <app-ui-button label="Continuar" icon="arrow-right" type="submit" />

      <app-ui-link
        label="Voltar ao login"
        route="/login"
        icon="arrow-left"
        [centered]="true"
      />
    </form>
  </app-auth-form-card>
</app-auth-page-layout>
