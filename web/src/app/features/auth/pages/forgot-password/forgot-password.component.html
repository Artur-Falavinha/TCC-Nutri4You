<app-auth-page-layout>
  <app-auth-form-card
    title="Esqueceu a senha?"
    description="Informe o e-mail cadastrado. Enviaremos um link para redefinir sua senha — abra o link recebido para continuar."
  >
    <form class="auth-form" [formGroup]="form" (ngSubmit)="enviarToken()">
      <app-form-alert [message]="errorMessage" />
      <app-form-alert [message]="successMessage" type="success" />

      <app-ui-input
        label="E-mail cadastrado"
        placeholder="seu@email.com"
        type="email"
        autocomplete="email"
        [required]="true"
        formControlName="email"
        [errorMessage]="fieldError('email')"
      />

      <app-ui-button
        label="Enviar link por e-mail"
        icon="key"
        type="submit"
        [loading]="sending"
      />

      <p class="auth-form__hint">
        O link costuma chegar em poucos minutos. Verifique também o spam.
      </p>

      <app-ui-link
        label="Voltar ao login"
        route="/login"
        icon="arrow-left"
        [centered]="true"
      />
    </form>
  </app-auth-form-card>
</app-auth-page-layout>
