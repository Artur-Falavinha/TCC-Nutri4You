<app-auth-page-layout>
  <app-auth-form-card
    title="Crie uma nova senha"
    description="Digite e repita a nova senha. Ela não pode ser a mesma da que você não lembrou."
  >
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <app-form-alert [message]="errorMessage" />
      <app-form-alert [message]="successMessage" type="success" />

      <app-ui-input
        label="Nova senha"
        placeholder="••••••••"
        type="password"
        autocomplete="new-password"
        [required]="true"
        formControlName="senha"
        [errorMessage]="fieldError('senha')"
      />

      <app-ui-input
        label="Confirmar nova senha"
        placeholder="••••••••"
        type="password"
        autocomplete="new-password"
        [required]="true"
        formControlName="confirmarSenha"
        [errorMessage]="fieldError('confirmarSenha')"
      />

      <app-ui-button
        label="Confirmar nova senha"
        icon="check"
        type="submit"
        [loading]="loading"
        [disabled]="!token"
      />

      <app-ui-link
        label="Voltar ao login"
        route="/login"
        icon="arrow-left"
        [centered]="true"
      />
    </form>
  </app-auth-form-card>
</app-auth-page-layout>
