<div class="modal__backdrop" (click)="onBackdropClick($event)" tabindex="0" (keyup.enter)="onBackdropClick($event)">
  <div class="modal__panel" role="dialog" aria-labelledby="inativar-modal-title">
    
    <header class="modal__header">
      <h2 id="inativar-modal-title" class="modal__title">Inativar paciente?</h2>
    </header>
    
    <p class="modal__description">
      Este paciente deixará de ter acesso ao sistema. Os dados cadastrais e o histórico clínico permanecem guardados no sistema.
    </p>

    @if (errorMessage) {
      <app-form-alert [message]="errorMessage" type="error" />
    }

    <footer class="modal__footer">
      <app-ui-button
        label="Cancelar"
        variant="outline"
        [fullWidth]="false"
        [disabled]="loading"
        (click)="onCancelar()"
      />
      
      <app-ui-button
        label="Inativar"
        icon="trash"
        variant="danger"
        [fullWidth]="false"
        [loading]="loading"
        (click)="onConfirmar()"
      />
    </footer>
  </div>
</div>
