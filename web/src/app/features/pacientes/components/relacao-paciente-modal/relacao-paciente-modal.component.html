<app-dialogo-confirmacao
  [titulo]="title"
  [descricao]="description"
  [confirmar]="confirmLabel"
  [icone]="acao === 'desvincular' ? 'link-break' : 'link'"
  [destrutivo]="acao === 'desvincular'"
  [ocupado]="loading"
  [rotuloOcupado]="acao === 'desvincular' ? 'Encerrando…' : 'Enviando…'"
  [erro]="erro"
  (fechar)="fechar.emit()"
  (confirmado)="onConfirmar()" />
