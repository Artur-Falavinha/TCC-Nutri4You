<div class="modal__backdrop" (click)="onBackdropClick($event)" tabindex="0" (keyup.enter)="onBackdropClick($event)">
  <div class="modal__panel" role="dialog" aria-labelledby="reativar-modal-title">
    
    <header class="modal__header">
      <h2 id="reativar-modal-title" class="modal__title">Reativar paciente?</h2>
    </header>
    
    <p class="modal__description">
      Este paciente voltará a ter acesso ao sistema e os relatórios clínicos voltarão a ficar disponíveis para edição.
    </p>

    @if (errorMessage) {
      <app-form-alert [message]="errorMessage" type="error" />
    }

    <footer class="modal__footer">
      <app-ui-button
        label="Cancelar"
        variant="outline"
        [fullWidth]="false"
        [disabled]="loading"
        (click)="onCancelar()"
      />
      
      <app-ui-button
        label="Reativar"
        icon="check-circle"
        variant="primary"
        [fullWidth]="false"
        [loading]="loading"
        (click)="onConfirmar()"
      />
    </footer>
  </div>
</div>
