<dialog #painel class="modal__panel" aria-labelledby="paciente-dialog-title"
  [attr.aria-describedby]="description() ? 'paciente-dialog-description' : null" (cancel)="cancelar($event)">
  <header class="modal__header">
    <h2 class="modal__title" id="paciente-dialog-title">{{ title() }}</h2>
  </header>

  @if (description()) {
    <p class="modal__description" id="paciente-dialog-description">{{ description() }}</p>
  }

  <ng-content />

  <footer class="modal__footer">
    <ng-content select="[dialogActions]" />
  </footer>
</dialog>
