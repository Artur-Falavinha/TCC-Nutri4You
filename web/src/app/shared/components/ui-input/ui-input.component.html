<div class="ui-input" [class.ui-input--invalid]="!!errorMessage">
  <label class="ui-input__label" [for]="id">
    {{ label }}
    @if (required) {
      <span class="ui-input__required" aria-hidden="true">*</span>
    }
  </label>
  <div
    class="ui-input__control"
    [class.ui-input__control--password]="isPasswordField"
    [class.ui-input__control--calendario]="campoData && seletorNativoDisponivel && !readonly"
    [class.ui-input__control--leading]="showLeadingIcon"
  >
    @if (showLeadingIcon) {
      <i [class]="'ph ui-input__leading ' + leadingIcon" aria-hidden="true"></i>
    }
    <input
      class="ui-input__field"
      [id]="id"
      [type]="resolvedInputType"
      [placeholder]="campoData && !placeholder ? 'DD/MM/AAAA' : placeholder"
      [value]="value"
      [disabled]="disabled"
      [readOnly]="readonly"
      [required]="required"
      [attr.inputmode]="campoData ? 'numeric' : inputmode"
      [attr.maxlength]="campoData ? 10 : maxlength"
      [attr.aria-invalid]="errorMessage ? 'true' : null"
      [attr.aria-describedby]="((errorMessage ? id + '-error ' : '') + (helperText ? id + '-help' : '')).trim() || null"
      [autocomplete]="autocomplete"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    @if (campoData && seletorNativoDisponivel && !readonly) {
      <input #calendario class="ui-input__calendario" type="date" tabindex="-1" aria-hidden="true"
        [value]="dataIso" [attr.min]="min" [attr.max]="max" [disabled]="disabled"
        (input)="selecionarData(calendario.value)" />
      <button class="ui-input__toggle ui-input__toggle--calendario" type="button" [disabled]="disabled"
        [attr.aria-label]="'Abrir calendário: ' + label" (click)="abrirCalendario(calendario)">
        <i class="ph ph-calendar-blank" aria-hidden="true"></i>
      </button>
    }
    @if (isPasswordField) {
      <button
        class="ui-input__toggle"
        type="button"
        [disabled]="disabled"
        [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="passwordVisible"
        (click)="togglePasswordVisibility()"
      >
        <i
          class="ph ui-input__toggle-icon"
          [class.ph-eye]="passwordVisible"
          [class.ph-eye-closed]="!passwordVisible"
          aria-hidden="true"
        ></i>
      </button>
    }
  </div>
  @if (helperText) {
    <p class="ui-input__help" [id]="id + '-help'">{{ helperText }}</p>
  }
  @if (errorMessage) {
    <p class="ui-input__error" [id]="id + '-error'" role="alert">{{ errorMessage }}</p>
  }
</div>
