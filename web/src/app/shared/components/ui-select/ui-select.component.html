<div class="ui-select" [class.ui-select--invalid]="!!errorMessage">
  <label class="ui-select__label" [for]="id">
    {{ label }}
    @if (required) {
      <span class="ui-select__required" aria-hidden="true">*</span>
    }
  </label>
  <div class="ui-select__wrapper">
    <select
      class="ui-select__field"
      [class.ui-select__field--empty]="!value"
      [id]="id"
      [disabled]="disabled"
      [required]="required"
      [value]="value"
      [attr.aria-invalid]="errorMessage ? true : null"
      [attr.aria-describedby]="errorMessage ? id + '-error' : null"
      (change)="onSelect($event)"
      (blur)="onBlur()"
    >
      <option value="" disabled hidden>{{ placeholder }}</option>
      @for (option of options; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <span class="ui-select__icon" aria-hidden="true">
      <img src="/icons/select-arrow.svg" alt="" width="20" height="20" />
    </span>
  </div>
  @if (errorMessage) {
    <p class="ui-select__error" [id]="id + '-error'" role="alert">{{ errorMessage }}</p>
  }
</div>
