<nav class="patient-tabs" aria-label="Seções do paciente">
  @for (tab of tabs; track tab.path) {
    <a
      class="patient-tabs__item"
      [routerLink]="['/pacientes', patientId, tab.path]"
      routerLinkActive="patient-tabs__item--active"
      ariaCurrentWhenActive="page"
      (click)="abrirSecao($event, tab.path)"
    >{{ tab.label }}</a>
  }
</nav>
