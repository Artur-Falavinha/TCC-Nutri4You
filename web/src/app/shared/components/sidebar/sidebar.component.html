<aside class="sidebar" [class.sidebar--expanded]="isExpanded">
  <div class="sidebar__top">
    <!-- Branding e Toggle -->
    <div class="sidebar__brand">
      <button class="sidebar__toggle" type="button" (click)="toggleSidebar()" aria-label="Alternar menu">
        <i class="ph ph-list" aria-hidden="true"></i>
      </button>
      <img
        class="sidebar__logo"
        src="/auth/logo-nutri4u.webp"
        alt="Nutri4U logo"
      />
    </div>

    <!-- Navegação principal -->
    <nav class="sidebar__nav" aria-label="Navegação principal">
      <a
        class="sidebar__nav-item"
        routerLink="/home"
        routerLinkActive="sidebar__nav-item--active"
      >
        <i class="ph ph-house sidebar__nav-icon" aria-hidden="true"></i>
        <span class="sidebar__label">Home</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/pacientes"
        routerLinkActive="sidebar__nav-item--active"
      >
        <i class="ph ph-users sidebar__nav-icon" aria-hidden="true"></i>
        <span class="sidebar__label">Pacientes</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/agenda"
        routerLinkActive="sidebar__nav-item--active"
      >
        <i class="ph ph-calendar-blank sidebar__nav-icon" aria-hidden="true"></i>
        <span class="sidebar__label">Agenda</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/configuracoes"
        routerLinkActive="sidebar__nav-item--active"
      >
        <i class="ph ph-gear-six sidebar__nav-icon" aria-hidden="true"></i>
        <span class="sidebar__label">Configurações</span>
      </a>
    </nav>
  </div>

  <!-- Rodapé da sidebar -->
  <div class="sidebar__footer">
    <div class="sidebar__user">
      <div class="sidebar__avatar" aria-hidden="true"></div>
      <span class="sidebar__user-name">{{ nomeNutricionista }}</span>
    </div>

    <button class="sidebar__nav-item sidebar__nav-item--logout" type="button" (click)="logout()">
      <i class="ph ph-sign-out sidebar__nav-icon" aria-hidden="true"></i>
      <span class="sidebar__label">Logout</span>
    </button>
  </div>
</aside>
