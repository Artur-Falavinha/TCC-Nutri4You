spring.profiles.active=test
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:nutri4you;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
api.security.token.secret=test-secret-nutri4you-minimum-length
api.security.token.expiration-hours=2
email.provider=console
app.email.auto-confirm=false
app.email.api-base-url=http://localhost:8080/api/v1
app.email.web-base-url=http://localhost:4200
