spring.application.name=backend

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# V6 foi integrada depois de V7 e deve atualizar os bancos que ja executaram V7.
spring.flyway.out-of-order=true
spring.jpa.open-in-view=false
api.security.token.secret=${JWT_SECRET:dev-only-change-this-secret-nutri4you}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8081,http://127.0.0.1:8081}

email.provider=${EMAIL_PROVIDER:console}
email.from=${EMAIL_FROM:noreply@nutri4you.local}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.web-base-url=${APP_EMAIL_WEB_BASE_URL:http://localhost:4200}
app.email.confirmacao-ttl-horas=${EMAIL_CONFIRMACAO_TTL_HORAS:24}
app.email.recuperacao-ttl-horas=${EMAIL_RECUPERACAO_TTL_HORAS:1}

# Uploads de exames: 5 MiB por arquivo; margem para o envelope multipart.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
