spring.application.name=backend
api.security.token.secret=${JWT_SECRET:dev-only-change-this-secret-nutri4you}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

email.provider=${EMAIL_PROVIDER:console}
email.from=${EMAIL_FROM:noreply@nutri4you.local}

app.email.auto-confirm=${EMAIL_AUTO_CONFIRM:false}
app.email.api-base-url=${APP_EMAIL_API_BASE_URL:http://localhost:8080/api/v1}
app.email.web-base-url=${APP_EMAIL_WEB_BASE_URL:http://localhost:4200}
app.email.confirmacao-ttl-horas=${EMAIL_CONFIRMACAO_TTL_HORAS:24}
app.email.recuperacao-ttl-horas=${EMAIL_RECUPERACAO_TTL_HORAS:1}
