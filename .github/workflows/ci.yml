name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validacao-markdown:
    name: Validação de Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar arquivos Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  deteccao-segredos:
    name: Detecção de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o histórico completo do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Procurar segredos no histórico
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  backend-test:
    name: Backend — testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(toJSON(github.event.pull_request.files.*.path), 'backend/')
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes Maven
        run: ./mvnw -B test

  web-quality:
    name: Web — lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(toJSON(github.event.pull_request.files.*.path), 'web/')
    defaults:
      run:
        working-directory: web
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build

  mobile-quality:
    name: Mobile — lint e typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(toJSON(github.event.pull_request.files.*.path), 'mobile/')
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar typecheck
        run: npm run typecheck

  gate:
    name: Gate
    if: ${{ always() }}
    needs:
      - validacao-markdown
      - deteccao-segredos
      - backend-test
      - web-quality
      - mobile-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado do CI
        env:
          RESULTADO_MARKDOWN: ${{ needs.validacao-markdown.result }}
          RESULTADO_SEGREDOS: ${{ needs.deteccao-segredos.result }}
          RESULTADO_BACKEND: ${{ needs.backend-test.result }}
          RESULTADO_WEB: ${{ needs.web-quality.result }}
          RESULTADO_MOBILE: ${{ needs.mobile-quality.result }}
        shell: bash
        run: |
          if [[ "$RESULTADO_MARKDOWN" != "success" ]]; then
            echo "::error::A validação de Markdown não foi concluída com sucesso."
            exit 1
          fi

          if [[ "$RESULTADO_SEGREDOS" != "success" ]]; then
            echo "::error::A detecção de segredos não foi concluída com sucesso."
            exit 1
          fi

          for resultado in "$RESULTADO_BACKEND" "$RESULTADO_WEB" "$RESULTADO_MOBILE"; do
            if [[ "$resultado" != "success" && "$resultado" != "skipped" ]]; then
              echo "::error::Job de aplicação falhou: $resultado"
              exit 1
            fi
          done

          echo "Todas as validações obrigatórias foram concluídas com sucesso."
