version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: nutri4you-db
    environment:
      - POSTGRES_USER=springuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nutri4you_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: nutri4you-backend
    ports:
      - "8080:8080"
      - "5005:5005" # Porta para debug no VS Code
    depends_on:
      - postgres-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/nutri4you_db
      - SPRING_DATASOURCE_USERNAME=springuser
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    volumes:
      - ./backend:/app
      - maven-repo:/root/.m2
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: nutri4you-web
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_OPTIONS=--max_old_space_size=4096
    restart: unless-stopped

volumes:
  postgres-data:
  maven-repo: